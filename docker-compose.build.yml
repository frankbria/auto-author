# Build overlay (#427). Used by CI and for local image builds:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
#
# Kept separate from the base file so a deploy on the VPS has no build definition
# to fall back on if an image pull fails — it errors instead of quietly compiling
# on the box, which is the behaviour this migration exists to remove.
services:
  backend:
    build:
      context: ./backend
  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at build time, so these
        # are build args rather than runtime env. Changing one needs a rebuild,
        # not a restart, and the image only serves the environment they name
        # (#779). Required, not defaulted: a default would silently bake one
        # environment's hosts into another's image.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required (the target environment's API, e.g. https://api.example.com/api/v1)}
        NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:?NEXT_PUBLIC_BETTER_AUTH_URL is required (the target environment's frontend origin)}
        NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:?NEXT_PUBLIC_ENVIRONMENT is required (staging or production)}
        # Optional: Sentry stays inert without a DSN.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
