# Container deploy for auto-author (#427).
#
# Base definitions. The staging box uses this together with
# docker-compose.staging.yml, which pins image tags and points at the host's env
# file. There is no Mongo service: Mongo is Atlas, and adding a local one here
# would quietly give a deploy a second, empty database to talk to.
#
# There is deliberately no `build:` here — see docker-compose.build.yml. Keeping
# build definitions out of the base file means a deploy on the box physically
# cannot rebuild an image, which is the point of the migration: no npm ci or
# uv sync on the shared VPS.
#
# Ports match what nginx already fronts (backend 8000, frontend 3002) so no
# upstream config changes. The box is shared with other apps — check the ports
# are still free before the first deploy.

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/frankbria/auto-author-backend:staging}
    restart: unless-stopped
    # Bound to loopback: nginx proxies from the same host, so there is no reason
    # to publish these on the shared box's public interface.
    ports:
      - "127.0.0.1:8000:8000"
    # The whole host env file is passed through. An explicit `environment:` list
    # silently drops anything not enumerated — the running app also needs
    # AWS_*, CLOUDINARY_*, BETTER_AUTH_ISSUER and BACKEND_CORS_ORIGINS, which an
    # allowlist would have omitted and which would have failed only at the point
    # someone uploaded a cover image.
    env_file:
      - .env
    environment:
      # Kept explicit as required-variable assertions: compose fails fast with a
      # clear message if one is missing, rather than the container starting and
      # erroring later. These override the env_file values with the same values.
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      # No default (#777): the production guards key off this marker, so a
      # forgotten value must stop the deploy, not quietly start as staging.
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT is required (development|test|staging|production)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      # The same /health endpoint the existing deploy smoke-checks (#341 made it
      # do real dependency checks rather than returning a static ok).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/frankbria/auto-author-frontend:staging}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    # No `env_file:` here, unlike the backend (#781). The shared .env holds the
    # OpenAI, Stripe, AWS and Cloudinary secrets, and an SSR compromise of this
    # process (#738 was one) would hand over everything it was given. This list
    # is the whole of what the Next server reads; scripts/test_frontend_env_allowlist.py
    # fails if a name appears here that frontend/src never reads.
    environment:
      # The frontend talks to Mongo directly for better-auth.
      DATABASE_URL: ${MONGODB_URI:?MONGODB_URI is required}
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://dev.autoauthor.app}
      NODE_ENV: production
      # Bare names pass through from .env when set and stay unset when not, so
      # the code's own fallbacks still apply. Password-reset mail (#332):
      EMAIL_SERVICE_PROVIDER:
      EMAIL_SERVICE_API_KEY:
      EMAIL_FROM_ADDRESS:
      EMAIL_FROM_NAME:
      # Read at runtime by the server-side Sentry init and the CSP middleware.
      # Public values, not secrets. (Not build args, so the browser bundle
      # does not get them.)
      NEXT_PUBLIC_SENTRY_DSN:
      NEXT_PUBLIC_ENVIRONMENT:
      # Retry tuning for better-auth's Mongo connect (frontend/src/lib/auth.ts).
      MONGO_MAX_RETRY_ATTEMPTS:
      MONGO_BASE_RETRY_DELAY_MS:
    depends_on:
      backend:
        condition: service_healthy
