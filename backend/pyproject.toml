[project]
name = "auto-author-backend"
version = "0.1.0"
description = "AI-powered book authoring backend API with FastAPI and MongoDB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core FastAPI dependencies
    "fastapi==0.139.0",
    "uvicorn==0.49.0",
    "python-multipart==0.0.32",
    # Database
    "pymongo==4.13.2",
    "motor==3.7.1",
    # Configuration and environment
    "python-dotenv==1.1.1",
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.10.1",
    # AI and external APIs
    "openai==2.45.0",
    "requests==2.34.2",
    # Authentication is better-auth (TypeScript) end to end: the backend only
    # validates session cookies, so it needs no JWT or password-hashing library.
    # python-jose (zero importers, dragged in ecdsa/rsa/pyasn1) and passlib
    # (helpers had no production callers) were removed in #342.
    # AWS SDK for transcription and S3
    "boto3==1.43.40",
    # Image processing and storage
    "cloudinary==1.45.0",
    "pillow==11.3.0",
    # Export functionality
    "reportlab==5.0.0",
    "python-docx==1.2.0",
    "html2text==2025.4.15",
    "ebooklib==0.20",
    "stripe==15.3.0",
    # Error tracking (issue #334) — inert unless SENTRY_DSN is set
    "sentry-sdk[fastapi]==2.66.1",
]

# Test, load-test, and dev tooling are NOT production runtime dependencies.
# Install with `uv sync --extra test` (CI) / `--all-extras` (full dev).
# Transitive deps of these (flask, gevent, werkzeug, pyzmq, …) are resolved
# into uv.lock by the resolver — do not list them by hand here.
[project.optional-dependencies]
test = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "pytest-cov==6.2.1",
    "pytest-mock==3.15.1",
    "faker==40.28.1",
    "coverage[toml]==7.15.2",
    "httpx==0.28.1",  # used only by tests; not imported by app/
]
load = [
    # locust <2.46 caps gevent below 26, which collides with the gevent floor in
    # [tool.uv] below. 2.46.2 dropped that upper bound.
    "locust==2.46.2",
    # locust-cloud removed: nothing imported or invoked it (it appeared only on
    # this line), and every published version requires gevent<26.0.0 — so it, not
    # locust, was what pinned uv.lock to the gevent 25.5.1 that Snyk flagged.
]
dev = [
    "auto-author-backend[test,load]",
]

# Floors for packages nothing here depends on directly, carried over from the
# retired requirements.in. They are advisory dodges (Snyk), so they must be
# constraints rather than dependencies — listing them under [project] would
# claim a direct dependency we do not have, and dropping them lets the resolver
# pick a vulnerable version (a plain resolve selects gevent 25.5.1).
# requirements.txt is now generated from uv.lock, so this file is the only
# place a version floor can be stated.
[tool.uv]
constraint-dependencies = [
    # Held at == rather than >=: a bare floor floats to the newest release, which
    # would silently adopt versions that have not served the 14-day cooldown in
    # .github/dependabot.yml (a floor picked up gevent 26.7.0, six days old).
    # 26.5.0 is what deploys already run. Dependabot bumps this like any other pin.
    "gevent==26.5.0",
    "h11>=0.16.0",
]
