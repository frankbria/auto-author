name: E2E Staging Tests

# Runs the staging E2E suite against the live https://dev.autoauthor.app environment.
#
# Triggers (chosen to avoid hammering live staging / spending AI tokens on every PR):
#   - workflow_run: after each SUCCESSFUL "Deploy Staging (Containers)" run, on
#     the commit that deploy ran from (#916). This replaced a 6-hourly schedule
#     that re-tested an unchanged build and spent live OpenAI calls doing it.
#     Infra drift between deploys is covered by staging-health.yml instead.
#   - workflow_dispatch: manual runs, with optional load-smoke and worker controls
#   - pull_request: ONLY when the PR carries the `e2e-staging` label AND the PR
#     head branch lives in this repository (fork PRs never run — their code would
#     execute against live staging inside the `staging` environment; see #191)
#
# Required GitHub Secrets (in the `staging` environment):
#   - TEST_USER_EMAIL
#   - TEST_USER_PASSWORD
# Alerting: a failed post-deploy run (or a dispatch from the default branch)
# opens/updates one `ci-alert:staging-e2e` issue and the next green one closes it
# (scripts/ci-alert-issue.sh, #776); no extra secret, it uses the workflow token.

on:
  workflow_run:
    # Matched by the deploy workflow's `name:` (scripts/test_staging_triggers.py
    # fails if the two drift apart).
    workflows: ['Deploy Staging (Containers)']
    types: [completed]
  workflow_dispatch:
    inputs:
      staging_e2e_workers:
        description: 'Number of Playwright workers for staging tests (default: 1)'
        required: false
        default: '1'
      run_load_smoke:
        description: 'Run a low-impact Locust load smoke against staging'
        required: false
        type: boolean
        default: false
  pull_request:
    types: [labeled, opened, synchronize, reopened]

# A new push to a labeled PR cancels the previous in-flight staging run.
# Least privilege: the default GITHUB_TOKEN grants write across most scopes.
# Nothing here needs more than reading the repository (#352).
permissions:
  contents: read

concurrency:
  group: e2e-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-staging:
    name: E2E Staging (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # TEST_USER_EMAIL / TEST_USER_PASSWORD live in the `staging` environment.
    environment:
      name: staging
      url: https://dev.autoauthor.app
    # Skip on PRs unless explicitly labeled `e2e-staging` AND the head branch is
    # in this repo. The same-repo guard blocks pwn-requests (#191): without it, a
    # maintainer labeling a fork PR lets later attacker pushes (`synchronize`)
    # re-run fork-controlled code (npm lifecycle scripts, Playwright specs) in the
    # `staging` environment against the live staging site.
    #
    # Post-deploy runs need a green deploy (`completed` also fires on failure and
    # cancellation). The head-repo check is defence in depth: the deploy is
    # dispatch-only, so its commit is always on a branch of this repository.
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'e2e-staging'))

    steps:
      # After a deploy, test the commit that deploy ran from, so the specs match
      # the build. Empty on every other event, which keeps checkout's default.
      # ponytail: a rollback (older image_tag) still checks out the dispatch
      # commit, so specs can be newer than the build; parse the tag from a deploy
      # `run-name` if rollbacks ever need their own post-deploy verdict.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against staging
        working-directory: frontend
        env:
          # Repo secrets are TEST_USER_EMAIL / TEST_USER_PASSWORD; map them to the
          # env names the auth fixture reads first.
          STAGING_TEST_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          STAGING_TEST_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          STAGING_E2E_WORKERS: ${{ github.event.inputs.staging_e2e_workers || '1' }}
        run: npm run test:e2e:staging

      - name: Write staging E2E summary
        if: always()
        run: |
          {
            echo "## Staging E2E run"
            echo ""
            echo "- Environment: https://dev.autoauthor.app"
            echo "- Workflow result: ${{ job.status }}"
            echo "- Workers: ${{ github.event.inputs.staging_e2e_workers || '1' }}"
            echo "- Visual smoke screenshots and failure video: see the staging test-results artifact"
            echo "- No trace, HTML report or results JSON is published (#599) — reproduce a failure by running the suite locally, where traces are on"
          } >> "$GITHUB_STEP_SUMMARY"

      # Screenshots and video only (#599). Everything excluded here carries a live
      # credential into a public artifact:
      #   error-context.md      - its page snapshot renders the password field's VALUE
      #   trace.zip             - request headers (session cookie) + the fill() argument
      #   staging-results.json  - the json reporter captures test stdout, and GitHub
      #                           masks secrets in LOGS but not in ARTIFACTS
      # Traces are also off under CI in the config; these exclusions are a second,
      # independent line of defence, so re-enabling one setting is not enough to
      # re-open the leak. `**/` matches at any depth, so each exclusion covers both
      # include roots.
      #
      # The Playwright HTML report is deliberately not uploaded either: it inlines
      # every failure attachment, which reproduces error-context.md. It is still
      # written on the runner, so the reporter works locally.
      #
      # This single always() step replaces the former failure()-only duplicate,
      # which uploaded the identical two trees under a second artifact name.
      - name: Upload staging test results and visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-test-results
          path: |
            frontend/tests/e2e/staging/test-results/
            frontend/test-results/
            !**/error-context.md
            !**/trace.zip
            !**/staging-results.json
          retention-days: 7

  # Post-deploy runs, and dispatches from the default branch (so a green rerun
  # closes the issue). Opens (or comments on) one labelled issue while staging
  # E2E is red and closes it on the next green run (#776, #916). Labelled-PR runs
  # never alert. A skipped suite (failed deploy) reports nothing. Separate job so
  # only it holds `issues: write`; the job that runs the suite stays read-only.
  alert:
    name: Alert on post-deploy staging result
    runs-on: ubuntu-latest
    needs: e2e-staging
    if: >-
      always() &&
      (github.event_name == 'workflow_run' ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch)) &&
      (needs.e2e-staging.result == 'failure' || needs.e2e-staging.result == 'success')
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT_LABEL: ci-alert:staging-e2e
          ALERT_TITLE: '[P0.28] Post-deploy staging E2E is failing'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.e2e-staging.result }}
        run: |
          if [ "$RESULT" = "failure" ]; then mode=failure; else mode=recovery; fi
          sh scripts/ci-alert-issue.sh "$mode"

  load-smoke:
    name: Staging Load Smoke (Locust)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://dev.autoauthor.app
    needs: e2e-staging
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_load_smoke == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          # v9 flipped the `prune-cache` default to false to ease load on PyPI
          # infrastructure, which grows the saved Actions cache (and its cost).
          # Pinned to true to keep the v8 behaviour we were already getting.
          prune-cache: true

      - name: Setup Python
        working-directory: backend
        run: uv python install 3.13

      - name: Install backend load dependencies
        working-directory: backend
        run: uv sync --extra load

      - name: Run low-impact staging load smoke
        working-directory: backend
        env:
          STAGING_TEST_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          STAGING_TEST_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          STAGING_API_URL: https://api.dev.autoauthor.app/api/v1
        run: >-
          uv run locust -f tests/load/staging_smoke.py StagingSmokeUser
          --headless
          --host=https://dev.autoauthor.app
          --users=2
          --spawn-rate=1
          --run-time=30s
          --html=load-smoke-report.html
          --csv=load-smoke

      - name: Write load smoke summary
        if: always()
        run: |
          {
            echo "## Staging load smoke"
            echo ""
            echo "- Target: https://dev.autoauthor.app"
            echo "- Users: 2"
            echo "- Duration: 30s"
            echo "- Report: see staging-load-smoke artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload load smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-load-smoke
          path: |
            backend/load-smoke-report.html
            backend/load-smoke*.csv
          retention-days: 7
