name: Tests and Quality Checks

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

# Least privilege: the default GITHUB_TOKEN grants write across most scopes.
# Nothing here needs more than reading the repository (#352).
permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linting
        working-directory: frontend
        run: npm run lint

      - name: Run type checking
        working-directory: frontend
        run: npm run typecheck

      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --coverage --passWithNoTests

      - name: Check coverage threshold
        working-directory: frontend
        run: npm test -- --coverage --coverageThreshold='{"global":{"lines":85,"statements":85,"branches":75,"functions":85}}'
        # Enforced (#118): gate is green at baseline, so a coverage regression must fail CI.
        # #328: global functions had drifted to ~84.6% (main failed its own gate, forcing
        # --admin overrides on every frontend PR). Fixed by dropping test-infra files from the
        # coverage denominator (jest.config.cjs coveragePathIgnorePatterns) + covering a few
        # genuinely-untested pure helpers, landing functions ~85.6% with headroom.

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --extra test

      - name: Run tests with coverage
        working-directory: backend
        env:
          MONGODB_URL: mongodb://localhost:27017/autoauthor_test
        run: |
          uv run pytest tests/ --cov=app --cov-report=xml --cov-report=term

      - name: Check coverage threshold
        working-directory: backend
        run: |
          uv run pytest --cov=app tests/ --cov-fail-under=85
        # Enforced (#118): gate is green at baseline, so a coverage regression must fail CI.

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Both audit tools exit 1 when they find advisories, which is the normal
      # case here — the gate script decides pass/fail. Any OTHER exit code means
      # the tool itself broke, and that must not be swallowed into a false green.
      # `|| rc=$?` is load-bearing: steps run under `bash -e`, so without it the
      # expected exit-1 would abort the step before the check below runs.
      # backend/requirements.txt is a generated export of uv.lock, not a source of
      # truth — nothing installs from it (deploy and CI both run `uv sync`, and the
      # pip-audit step below re-exports rather than reading the committed file).
      # That made drift invisible, and Dependabot's uv ecosystem edits this file
      # for TRANSITIVE deps, so #416-#421 and #430-#434 changed no installed
      # version at all. Worse than churn: a bump that patches a real advisory
      # would look applied while the vulnerable version stayed in uv.lock.
      #
      # Comparing the committed file against a fresh export turns both failure
      # modes loud — a hand-edited export, and a requirements.txt-only Dependabot
      # PR, now fail here instead of merging as a silent no-op. Regenerate with
      # the command in the file's own header.
      # Compared with the `#    uv export ... -o <path>` header line filtered out:
      # uv writes its own output path into that comment, so a temp-file export can
      # never be byte-identical to one written to requirements.txt. Filtering it is
      # what makes this check possible at all; without it the step fails always.
      - name: requirements.txt matches uv.lock
        working-directory: backend
        run: |
          uv export --all-extras --no-emit-project --no-hashes \
            --format requirements-txt > /tmp/reqs-raw.txt
          grep -v '^#    uv export' /tmp/reqs-raw.txt > /tmp/reqs-expected.txt
          grep -v '^#    uv export' requirements.txt > /tmp/reqs-actual.txt
          if ! diff -u /tmp/reqs-actual.txt /tmp/reqs-expected.txt; then
            echo "::error::backend/requirements.txt is out of sync with uv.lock."
            echo "It is a generated file. Regenerate it rather than editing by hand:"
            echo "  cd backend && uv export --all-extras --no-emit-project --no-hashes --format requirements-txt -o requirements.txt"
            echo "If a dependency bump only touched requirements.txt, apply it to pyproject.toml/uv.lock instead — editing the export alone changes nothing that is installed."
            exit 1
          fi
          echo "OK: requirements.txt matches uv.lock."

      - name: Run pip-audit
        working-directory: backend
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt > /tmp/reqs.txt
          rc=0
          uvx pip-audit -r /tmp/reqs.txt --format=json > /tmp/pip-audit.json || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::pip-audit failed with exit $rc"; exit "$rc"; fi

      # The npm audit below runs with working-directory: frontend, so it resolves
      # ONLY frontend/package-lock.json. Any other npm lockfile in the repo is
      # invisible to this gate — and .github/dependabot.yml aims its npm ecosystem
      # at /frontend and / as well, so version updates miss it too. That blind spot
      # is not hypothetical: frontend/scripts/package-lock.json sat there orphaned
      # after #342 deleted its package.json and system-test.js, silently pinning a
      # critical form-data advisory and 12 high axios ones. Only Dependabot security
      # alerts could see it, and those were disabled until #413.
      #
      # Fail loudly if a new lockfile appears outside the scanned directory, rather
      # than scanning it silently — a lockfile with no package.json beside it is
      # usually debris to delete, and the right response is a human decision about
      # whether to remove it or extend coverage in both this job and dependabot.yml.
      - name: No unscanned npm lockfiles
        run: |
          unscanned=$(find . -name package-lock.json \
            -not -path './node_modules/*' -not -path '*/node_modules/*' \
            -not -path './frontend/package-lock.json')
          if [ -n "$unscanned" ]; then
            echo "::error::npm lockfile(s) outside the audited tree — neither npm audit nor Dependabot version updates cover these:"
            echo "$unscanned"
            echo "Delete them if orphaned, or add the directory to BOTH this job and .github/dependabot.yml."
            exit 1
          fi
          echo "OK: frontend/package-lock.json is the only npm lockfile."

      # npm audit resolves straight from the lockfile — no `npm ci` needed.
      - name: Run npm audit
        working-directory: frontend
        run: |
          rc=0
          npm audit --json > /tmp/npm-audit.json || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::npm audit failed with exit $rc"; exit "$rc"; fi

      - name: Check advisories against the baseline
        run: |
          python scripts/audit_gate.py \
            --pip-audit /tmp/pip-audit.json \
            --npm-audit /tmp/npm-audit.json \
            --baseline security-baseline.json | tee /tmp/audit-report.txt
          rc=${PIPESTATUS[0]}
          { echo '## Supply-chain audit'; echo '```'; cat /tmp/audit-report.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: Test the audit gate itself
        run: uvx --with pytest pytest scripts/test_audit_gate.py -q

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend server
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017
          DATABASE_NAME: auto_author_e2e_test
          BYPASS_AUTH: 'true'
          # Required alongside BYPASS_AUTH in every environment since #307 —
          # without it the backend coerces the bypass off and E2E gets 401s.
          E2E_ALLOW_BYPASS: '1'
          BETTER_AUTH_SECRET: 'test-secret-for-ci-minimum-32-characters-long-safe-for-testing'
          BETTER_AUTH_URL: 'http://localhost:3000'
        run: |
          echo "Starting backend with local MongoDB..."
          echo "DATABASE_NAME: $DATABASE_NAME"
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend to start..."
          BACKEND_READY=false
          for i in {1..30}; do
            if curl -s http://localhost:8000/ > /dev/null; then
              echo "Backend is ready!"
              BACKEND_READY=true
              break
            fi
            sleep 1
          done
          if [ "$BACKEND_READY" != "true" ]; then
            echo "ERROR: Backend failed to start within 30 seconds"
            exit 1
          fi

      # Frontend server is started by Playwright's webServer configuration
      # No need to start it manually here

      - name: Run E2E tests
        working-directory: frontend
        env:
          BYPASS_AUTH: 'true'
          # Required alongside BYPASS_AUTH in every environment since #272.
          # Playwright's webServer env also sets this; pinned here for clarity.
          E2E_ALLOW_BYPASS: '1'
          BASE_URL: 'http://localhost:3000'
          # Must include the /api/v1 prefix the backend mounts (settings.API_V1_PREFIX);
          # the frontend app and the E2E test helpers both read this for API calls.
          NEXT_PUBLIC_API_URL: 'http://localhost:8000/api/v1'
          # Better-auth init throws without a secret; reuse the canonical CI test secret.
          BETTER_AUTH_SECRET: 'test-secret-for-ci-minimum-32-characters-long-safe-for-testing'
          BETTER_AUTH_URL: 'http://localhost:3000'
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, e2e-tests, security-audit]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Tests: ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Tests: ${{ needs.backend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Audit: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.frontend-tests.result }}" == "failure" ] || \
             [ "${{ needs.backend-tests.result }}" == "failure" ] || \
             [ "${{ needs.security-audit.result }}" == "failure" ] || \
             [ "${{ needs.e2e-tests.result }}" == "failure" ]; then
            echo "❌ **Quality checks failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All quality checks passed**" >> $GITHUB_STEP_SUMMARY
          fi
