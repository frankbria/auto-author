name: Tests and Quality Checks

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

# Least privilege: the default GITHUB_TOKEN grants write across most scopes.
# Nothing here needs more than reading the repository (#352).
permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linting
        working-directory: frontend
        run: npm run lint

      - name: Run type checking
        working-directory: frontend
        run: npm run typecheck

      # The base tsconfig excludes every test-shaped path, so the step above sees
      # none of the ~170 test files, and next/jest's SWC strips types without
      # checking them. This covers that gap against a ledger (#625). ~6s.
      # A spec no config's testDir covers can never run, and reports identically
      # to one that passes (#613). Same shape as "No unscanned npm lockfiles".
      - name: Every Playwright spec is reachable by a config
        working-directory: frontend
        run: npm run check:specs

      - name: Type check test sources
        working-directory: frontend
        run: npm run typecheck:tests

      - name: Run unit tests with coverage threshold
        working-directory: frontend
        run: npm test -- --coverage --coverageThreshold='{"global":{"lines":85,"statements":85,"branches":75,"functions":85}}'
        # One run (#852): the gate used to be a second full pass of the suite.
        # Enforced (#118): gate is green at baseline, so a coverage regression must fail CI.
        # #328: global functions had drifted to ~84.6% (main failed its own gate, forcing
        # --admin overrides on every frontend PR). Fixed by dropping test-infra files from the
        # coverage denominator (jest.config.cjs coveragePathIgnorePatterns) + covering a few
        # genuinely-untested pure helpers, landing functions ~85.6% with headroom.

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The version the backend declares, not a copy of it: this said 3.11
          # while pyproject requires >=3.13, so uv fetched 3.13 anyway (#852).
          python-version-file: backend/.python-version

      # The pinned action, not `curl … | sh` (#819): that ran whatever the
      # address served on the day, with this job's token. And the version the
      # image build pins in backend/Dockerfile, not the newest one: without
      # `version` the action installs whatever was released that day. Dependabot
      # moves the Dockerfile's uv by pull request, and this follows it.
      - name: Read the pinned uv version
        id: uv
        run: |
          version=$(sed -n 's|^FROM astral/uv:\([0-9][0-9.]*\)@sha256:.*|\1|p' backend/Dockerfile)
          [ -n "$version" ] || { echo "::error::backend/Dockerfile pins no uv version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: true

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --extra test

      - name: Run tests with coverage
        working-directory: backend
        env:
          MONGODB_URL: mongodb://localhost:27017/autoauthor_test
        run: |
          uv run pytest tests/ --cov=app --cov-report=xml --cov-report=term --cov-fail-under=85
        # Enforced (#118): gate is green at baseline, so a coverage regression must fail CI.
        # One run (#852): the gate used to be a second full pass of the suite.

      # The Mongo service above is standalone, and a standalone server has no
      # transactions: delete_book's transaction branch, the one Atlas runs, had
      # never executed here (#839). A service container takes no command, so
      # the replica set is started by hand, on its own port. REQUIRE_REPLICA_SET
      # turns the skip those tests take on a standalone server into a failure.
      - name: Cascade delete and startup repair on a single-node replica set
        working-directory: backend
        env:
          REQUIRE_REPLICA_SET: '1'
          TEST_MONGO_URI: mongodb://localhost:27018/auto-author-test?replicaSet=rs0
        run: |
          # The file limit: a container's default is low, and mongod aborts when it runs out.
          docker run -d --name mongo-rs --ulimit nofile=64000:64000 -p 27018:27018 mongo:7 --replSet rs0 --port 27018 --bind_ip_all
          shell() { docker exec mongo-rs mongosh --quiet --port 27018 --eval "$1"; }
          for _ in $(seq 1 30); do shell 'db.adminCommand({ping: 1}).ok' >/dev/null 2>&1 && break; sleep 1; done
          shell 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27018"}]}).ok'
          for _ in $(seq 1 30); do [ "$(shell 'db.hello().isWritablePrimary')" = true ] && break; sleep 1; done
          [ "$(shell 'db.hello().isWritablePrimary')" = true ] || { echo "::error::the replica set has no primary"; exit 1; }
          uv run pytest tests/test_db/test_cascade_delete_atomic.py tests/test_startup_indexes.py --no-cov -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # The pinned action, not `curl … | sh` (#819): that ran whatever the
      # address served on the day, with this job's token. And the version the
      # image build pins in backend/Dockerfile, not the newest one: without
      # `version` the action installs whatever was released that day. Dependabot
      # moves the Dockerfile's uv by pull request, and this follows it.
      - name: Read the pinned uv version
        id: uv
        run: |
          version=$(sed -n 's|^FROM astral/uv:\([0-9][0-9.]*\)@sha256:.*|\1|p' backend/Dockerfile)
          [ -n "$version" ] || { echo "::error::backend/Dockerfile pins no uv version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: true

      # Both audit tools exit 1 when they find advisories, which is the normal
      # case here — the gate script decides pass/fail. Any OTHER exit code means
      # the tool itself broke, and that must not be swallowed into a false green.
      # `|| rc=$?` is load-bearing: steps run under `bash -e`, so without it the
      # expected exit-1 would abort the step before the check below runs.
      # ruff runs here as well as in pre-commit (#561). The pre-commit hook is the
      # fast local signal, but it is bypassable with --no-verify and only fires on
      # `files: ^backend/`; CI is the enforced gate. app/ and tests/ are clean at
      # 0 findings under the pinned rule set, so this starts green and stays that
      # way rather than arriving with a backlog.
      - name: Backend lint (ruff)
        working-directory: backend
        run: uv run --extra test ruff check app/ tests/

      # Scans the FULL dependency surface, extras included (#522). It previously
      # exported `--no-dev`, so anything reachable only through the `test`, `load`
      # or `dev` extras was invisible: it could not fail CI and never reached
      # `security-baseline.json` either — not deferred with a reason, simply
      # unseen. GitHub's alert list and this gate then disagreed with no record of
      # why, which is exactly what the baselined design exists to prevent. The
      # neighbouring lockfile-sync step already exported `--all-extras`; the two
      # steps scanning different sets was the real defect.
      #
      # Widening cost nothing when it landed: 478 -> 977 exported lines, and the
      # only advisory on the wider surface then was click's PYSEC-2026-2132.
      # click has since been upgraded past it, and the Python side of the
      # baseline is empty (#821). A test-only advisory does not ship to the
      # container, but it does run in CI against this repo, so it is ledgered
      # with a reason rather than hidden.
      - name: Run pip-audit
        working-directory: backend
        run: |
          uv export --all-extras --no-emit-project --format requirements-txt > /tmp/reqs.txt
          rc=0
          uvx pip-audit -r /tmp/reqs.txt --format=json > /tmp/pip-audit.json || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::pip-audit failed with exit $rc"; exit "$rc"; fi

      # The npm audit below runs with working-directory: frontend, so it resolves
      # ONLY frontend/package-lock.json. Any other npm lockfile in the repo is
      # invisible to this gate — and .github/dependabot.yml aims its npm ecosystem
      # at /frontend and / as well, so version updates miss it too. That blind spot
      # is not hypothetical: frontend/scripts/package-lock.json sat there orphaned
      # after #342 deleted its package.json and system-test.js, silently pinning a
      # critical form-data advisory and 12 high axios ones. Only Dependabot security
      # alerts could see it, and those were disabled until #413.
      #
      # Fail loudly if a new lockfile appears outside the scanned directory, rather
      # than scanning it silently — a lockfile with no package.json beside it is
      # usually debris to delete, and the right response is a human decision about
      # whether to remove it or extend coverage in both this job and dependabot.yml.
      - name: No unscanned npm lockfiles
        run: |
          unscanned=$(find . -name package-lock.json \
            -not -path './node_modules/*' -not -path '*/node_modules/*' \
            -not -path './frontend/package-lock.json')
          if [ -n "$unscanned" ]; then
            echo "::error::npm lockfile(s) outside the audited tree — neither npm audit nor Dependabot version updates cover these:"
            echo "$unscanned"
            echo "Delete them if orphaned, or add the directory to BOTH this job and .github/dependabot.yml."
            exit 1
          fi
          echo "OK: frontend/package-lock.json is the only npm lockfile."

      # npm audit resolves straight from the lockfile — no `npm ci` needed.
      #
      # The registry's audit endpoint fails intermittently, and npm reports that
      # failure as exit 1 — the same code it uses for "vulnerabilities found" — so
      # the exit status alone cannot tell the two apart. A registry error therefore
      # slips through and hands audit_gate.py a truncated document, which it
      # correctly rejects, turning a required check red for no real reason.
      # Treat "output has no `vulnerabilities` key" as the retry signal instead.
      - name: Run npm audit
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            rc=0
            npm audit --json > /tmp/npm-audit.json || rc=$?
            if [ "$rc" -gt 1 ]; then echo "::error::npm audit failed with exit $rc"; exit "$rc"; fi
            if jq -e 'has("vulnerabilities")' /tmp/npm-audit.json >/dev/null 2>&1; then
              echo "npm audit returned well-formed output on attempt $attempt"
              exit 0
            fi
            echo "::warning::npm audit output has no 'vulnerabilities' key on attempt $attempt (registry audit endpoint erroring); retrying"
            sleep $((attempt * 10))
          done
          echo "::error::npm audit returned malformed output on 3 consecutive attempts — the registry audit endpoint is failing, not this repo"
          exit 1

      - name: Check advisories against the baseline
        run: |
          python scripts/audit_gate.py \
            --pip-audit /tmp/pip-audit.json \
            --npm-audit /tmp/npm-audit.json \
            --min-severity moderate \
            --baseline security-baseline.json | tee /tmp/audit-report.txt
          rc=${PIPESTATUS[0]}
          { echo '## Supply-chain audit'; echo '```'; cat /tmp/audit-report.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: Test the audit gate and dependabot config
        run: uvx --with pytest --with pyyaml pytest scripts/ -q

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # The pinned action, not `curl … | sh` (#819): that ran whatever the
      # address served on the day, with this job's token. And the version the
      # image build pins in backend/Dockerfile, not the newest one: without
      # `version` the action installs whatever was released that day. Dependabot
      # moves the Dockerfile's uv by pull request, and this follows it.
      - name: Read the pinned uv version
        id: uv
        run: |
          version=$(sed -n 's|^FROM astral/uv:\([0-9][0-9.]*\)@sha256:.*|\1|p' backend/Dockerfile)
          [ -n "$version" ] || { echo "::error::backend/Dockerfile pins no uv version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend server
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017
          DATABASE_NAME: auto_author_e2e_test
          # Required since #777 — the backend refuses to start without it.
          ENVIRONMENT: test
          BYPASS_AUTH: 'true'
          # Required alongside BYPASS_AUTH in every environment since #307 —
          # without it the backend coerces the bypass off and E2E gets 401s.
          E2E_ALLOW_BYPASS: '1'
          BETTER_AUTH_SECRET: 'test-secret-for-ci-minimum-32-characters-long-safe-for-testing'
          BETTER_AUTH_URL: 'http://localhost:3000'
        run: |
          echo "Starting backend with local MongoDB..."
          echo "DATABASE_NAME: $DATABASE_NAME"
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend to start..."
          BACKEND_READY=false
          for i in {1..30}; do
            if curl -s http://localhost:8000/ > /dev/null; then
              echo "Backend is ready!"
              BACKEND_READY=true
              break
            fi
            sleep 1
          done
          if [ "$BACKEND_READY" != "true" ]; then
            echo "ERROR: Backend failed to start within 30 seconds"
            exit 1
          fi

      # Frontend server is started by Playwright's webServer configuration
      # No need to start it manually here

      - name: Run E2E tests
        working-directory: frontend
        env:
          BYPASS_AUTH: 'true'
          # Required alongside BYPASS_AUTH in every environment since #272.
          # Playwright's webServer env also sets this; pinned here for clarity.
          E2E_ALLOW_BYPASS: '1'
          BASE_URL: 'http://localhost:3000'
          # Must include the /api/v1 prefix the backend mounts (settings.API_V1_PREFIX);
          # the frontend app and the E2E test helpers both read this for API calls.
          NEXT_PUBLIC_API_URL: 'http://localhost:8000/api/v1'
          # Better-auth init throws without a secret; reuse the canonical CI test secret.
          BETTER_AUTH_SECRET: 'test-secret-for-ci-minimum-32-characters-long-safe-for-testing'
          BETTER_AUTH_URL: 'http://localhost:3000'
        run: npx playwright test --project=chromium

      # Everything above runs with the bypass on. This starts its own backend
      # and frontend with it off, on other ports and another database, and
      # signs up through the page (#843). It is part of this required job.
      - name: Run real-auth E2E (no bypass)
        working-directory: frontend
        env:
          BETTER_AUTH_SECRET: 'test-secret-for-ci-minimum-32-characters-long-safe-for-testing'
        run: npx playwright test --config=playwright.real-auth.config.ts

      - name: Show real-auth server logs
        if: failure()
        working-directory: frontend
        run: tail -n 80 test-results/real-auth-backend.log test-results/real-auth-frontend.log || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, e2e-tests, security-audit]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Tests: ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Tests: ${{ needs.backend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Audit: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.frontend-tests.result }}" == "failure" ] || \
             [ "${{ needs.backend-tests.result }}" == "failure" ] || \
             [ "${{ needs.security-audit.result }}" == "failure" ] || \
             [ "${{ needs.e2e-tests.result }}" == "failure" ]; then
            echo "❌ **Quality checks failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All quality checks passed**" >> $GITHUB_STEP_SUMMARY
          fi
