# Dependabot version updates with supply-chain cooldown stepdown:
# semver ecosystems wait 7d (minor/patch) / 14d (major); others 14d flat.
# Security-advisory updates bypass cooldown (GitHub behavior).
version: 2
updates:
  # /frontend, not /: the root package.json is a PM2 shell with zero deps and no
  # lockfile, so an npm ecosystem aimed at "/" watched nothing (#342). The real
  # tree is frontend/package-lock.json.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    # Grouping (#517). Ungrouped, each bump opened its own PR; with branch
    # protection's required_status_checks.strict=true every merge flipped the rest
    # to BEHIND, so the 2026-08-25 sweep spent ~2h20m and 9 full CI runs landing 9
    # one-to-three-line changes. Grouping collapses that at the source.
    #
    # The split is deliberate: a grouped PR is cheap to merge and expensive to
    # review or revert, which is the wrong trade for anything that reaches a user.
    # A production major therefore matches no group and arrives on its own.
    # mongodb 6.21.0 -> 7.5.0 (#507) is the worked example — it earned a solo PR
    # and its own staging verification (#516), and burying it in a batch of
    # lockfile bumps would have hidden the one change worth reading.
    #
    # Security updates are NOT grouped: `applies-to` defaults to version-updates,
    # so an advisory patch still lands alone and fast. That default is the one we
    # want; don't add `applies-to: security-updates` here.
    groups:
      frontend-dev:
        # Dev deps never ship, so a major is a CI concern at worst.
        dependency-type: "development"
        patterns: ["*"]
      frontend-prod:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    #
    # `dependency-type` classifies DIRECT dependencies only. A pre-merge harness
    # run suggested that leaves an "indirect residue" of extra solo PRs, but that
    # was an artefact of running the job with `allowed-updates: all`: Dependabot
    # only opens PRs for direct npm dependencies to begin with, and the first live
    # sweep produced no such residue. No catch-all group is needed.

    ignore:
      # @types/node must track the Node we actually run, not the newest release.
      # Types ahead of the runtime remove the compile-time guardrail: typecheck
      # goes green and the call fails on the server (#422 proposed 20 -> 26 while
      # CI ran 20 and deploy pinned 18). Minor/patch still flow through.
      #
      # #428 settled the runtime on Node 24 everywhere — CI, E2E, and both deploy
      # workflows — and @types/node is now pinned ^24 to match, so the gap this
      # guards is closed rather than merely capped. The rule stays because the
      # coupling is permanent: @types/node should only cross a major when the
      # runtime does. When Node moves (24 is Active LTS to April 2028), bump the
      # workflows, engines.node and this pin together, in one change.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    # See the npm entry above for why majors stay ungrouped. No dev/prod split
    # here: GitHub's options reference lists `dependency-type` as supported by
    # bundler, composer, mix, maven, npm and pip — `uv` is not on that list, so
    # splitting on it would be relying on undocumented behaviour. One minor/patch
    # group is the honest version.
    #
    # Measured on the first live sweep, 2026-08-26 (#539): this ecosystem opened
    # one group of 10 minor/patch bumps plus openai 2.45.0 -> 3.0.0 on its own.
    # openai is the one that matters — a production runtime major arriving alone,
    # exactly as mongodb 6 -> 7 should have.
    #
    # A pre-merge dependabot/cli run predicted larger numbers; it ran with
    # `allowed-updates: all` and no memory of previously-closed PRs, so it
    # overcounted. Trust the live figures.
    groups:
      backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Majors ARE grouped here, unlike npm/uv. Actions ship no runtime code, their
    # bumps are one-line tag moves, and a major (v3 -> v4) is the ordinary case —
    # excluding majors would collapse almost nothing. This ecosystem is also the
    # storm's origin: #498/#501/#504/#506 all edited build-images.yml at once, and
    # in that pile-up Dependabot self-closed #504 claiming setup-buildx-action was
    # "up-to-date now" while main still pinned @v3. One PR per sweep, one diff to
    # read, no self-collision.
    groups:
      actions:
        patterns: ["*"]

    # github-actions doesn't support semver-* cooldown keys (config parse error)
    cooldown:
      default-days: 14
