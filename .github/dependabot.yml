# Dependabot version updates with supply-chain cooldown stepdown:
# semver ecosystems wait 7d (minor/patch) / 14d (major); others 14d flat.
# Security-advisory updates bypass cooldown (GitHub behavior).
version: 2
updates:
  # /frontend, not /: the root package.json is a PM2 shell with zero deps and no
  # lockfile, so an npm ecosystem aimed at "/" watched nothing (#342). The real
  # tree is frontend/package-lock.json.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    ignore:
      # @types/node must track the Node we actually run, not the newest release.
      # CI is on Node 20 and deploy-staging.yml pins 18, so a major bump (#422
      # proposed 20 -> 26) types APIs the runtime doesn't have: typecheck goes
      # green and the call fails on the server. Minor/patch still flow through.
      # Lift this when #428 settles on one Node major across CI and deploy.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # github-actions doesn't support semver-* cooldown keys (config parse error)
    cooldown:
      default-days: 14
