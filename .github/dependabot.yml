# Dependabot version updates with supply-chain cooldown stepdown:
# semver ecosystems wait 7d (minor/patch) / 14d (major); others 14d flat.
# Security-advisory updates bypass cooldown (GitHub behavior).
version: 2
updates:
  # /frontend, not /: the root package.json is a PM2 shell with zero deps and no
  # lockfile, so an npm ecosystem aimed at "/" watched nothing (#342). The real
  # tree is frontend/package-lock.json.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    ignore:
      # @types/node must track the Node we actually run, not the newest release.
      # Types ahead of the runtime remove the compile-time guardrail: typecheck
      # goes green and the call fails on the server (#422 proposed 20 -> 26 while
      # CI ran 20 and deploy pinned 18). Minor/patch still flow through.
      #
      # #428 settled the runtime on Node 24 everywhere — CI, E2E, and both deploy
      # workflows — and @types/node is now pinned ^24 to match, so the gap this
      # guards is closed rather than merely capped. The rule stays because the
      # coupling is permanent: @types/node should only cross a major when the
      # runtime does. When Node moves (24 is Active LTS to April 2028), bump the
      # workflows, engines.node and this pin together, in one change.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    # requirements.txt is a generated export of uv.lock, not a source of truth.
    # Dependabot's uv ecosystem parsed it as a manifest, and transitive deps exist
    # ONLY there — so #499/#503/#505 each edited the export alone: nothing installed
    # changed, and each failed the lock/export sync gate in tests.yml. Upstream bug:
    # dependabot-core#13912. Hidden here, Dependabot sees pyproject.toml/uv.lock only,
    # so a transitive bump is either a real bump or no PR at all (#512).
    #
    # Trade-off, deliberate: a direct-dep PR now bumps pyproject.toml/uv.lock and
    # leaves the export stale, so the sync gate asks for one command on the branch
    # (it prints it). Not automated — a GITHUB_TOKEN push does not re-trigger the
    # required checks, so a bot that pushed the export would leave every backend PR
    # blocked on checks that never run. See docs/references/quality-standards.md.
    #
    # Patterns are relative to `directory`, so this is "requirements.txt", not
    # "backend/requirements.txt"; test_dependabot_config.py pins that.
    exclude-paths:
      - "requirements.txt"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # github-actions doesn't support semver-* cooldown keys (config parse error)
    cooldown:
      default-days: 14
